<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APIFlow Monitor — Dashboard</title>
  <!-- Root yönlendirme kaldırıldı: Sonsuz döngü engellendi. -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .header h1 { font-size: 24px; color: #333; }
    .header-actions { display: flex; gap: 12px; align-items: center; }
    .badge-container { display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: #f5f5f5; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .env-badge { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .btn { padding: 10px 16px; background: #667eea; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; }
    .btn:hover { background: #5568d3; }
    .controls { display: flex; gap: 12px; margin-bottom: 20px; background: white; padding: 16px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .controls input { flex: 1; padding: 10px 12px; border: 1px solid #e0e0e0; border-radius: 6px; font-size: 14px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-bottom: 30px; }
    .card { background: white; border-radius: 8px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); transition: transform 0.2s; }
      /* Card Style Variants */
      .card.glass { background: rgba(255,255,255,0.10); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.22); color: #222; }
      .card.glass { background: rgba(255,255,255,0.10); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.22); color: #222; }
      .card.gradient { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; border: none; }
      .card.flat { background: #f8fafc; border: 1px solid #e2e8f0; box-shadow: none; color: #222; }
      .card.border { background: #fff; border: 2px solid #667eea; color: #222; }
      .select-dashboard { margin-left:8px; padding:7px 10px; border-radius:6px; border:1px solid #e0e0e0; font-size:13px; }
    .card:hover { transform: translateY(-4px); }
    .card-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 12px; }
    .card-title { font-size: 16px; font-weight: 600; color: #333; flex: 1; }
    .card-status { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 4px; }
    .status-up { background: #dcfce7; color: #166534; }
    .status-warn { background: #fef3c7; color: #92400e; }
    .status-down { background: #fee2e2; color: #991b1b; }
    .status-none { background: #f3f4f6; color: #6b7280; }
    .card-url { font-size: 12px; color: #666; margin-bottom: 12px; word-break: break-all; font-family: 'Monaco', 'Courier New', monospace; }
    .card-info { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; font-size: 12px; }
    .info-item { display: flex; flex-direction: column; gap: 2px; }
    .info-label { color: #999; font-size: 10px; text-transform: uppercase; }
    .info-value { color: #333; font-weight: 500; }
    .card-actions { display: flex; gap: 8px; }
    .card-actions button { flex: 1; padding: 8px 12px; font-size: 12px; border: none; border-radius: 4px; cursor: pointer; }
    .btn-edit { background: #dbeafe; color: #0369a1; }
    .btn-delete { background: #fee2e2; color: #991b1b; }
    .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
    .modal.open { display: flex; }
    .modal-content { background: white; border-radius: 8px; padding: 24px; max-width: 500px; width: 100%; max-height: 90vh; overflow-y: auto; }
    .modal-header { font-size: 18px; font-weight: 600; margin-bottom: 16px; color: #333; }
    .modal-body { margin-bottom: 20px; }
    .form-group { margin-bottom: 16px; display: flex; flex-direction: column; gap: 4px; }
    .form-group label { font-size: 12px; font-weight: 600; color: #666; text-transform: uppercase; }
    .form-group input, .form-group select { padding: 10px 12px; border: 1px solid #e0e0e0; border-radius: 6px; font-size: 14px; }
    .modal-footer { display: flex; gap: 12px; justify-content: flex-end; }
    .modal-footer button { padding: 10px 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; }
    .btn-close { background: #e0e0e0; color: #333; }
    .empty-state { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: #999; }
    @media (max-width: 640px) { .cards { grid-template-columns: 1fr; } }
    .visual-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .viz-box { background: #f3f4f6; border-radius: 6px; padding: 6px 10px; min-width: 80px; min-height: 38px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .tiny { font-size: 11px; color: #64748b; margin-bottom: 2px; }
    .spark-bars { display: flex; align-items: flex-end; gap: 2px; }
    .spark-bar { border-radius: 2px; }
    /* Kart settings çarkı ve popup */
    .card-settings-btn {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      margin-left: 8px;
      color: #888;
      transition: color 0.2s;
      padding: 0;
      line-height: 1;
    }
    .card-settings-btn:hover {
      color: #2563eb;
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      position: relative;
    }
    .card-settings-popup {
      position: absolute;
      right: 0;
      top: 36px;
      z-index: 10;
      background: #fff;
      color: #222;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.13);
      padding: 12px 16px;
      min-width: 160px;
      font-size: 14px;
    }
    .card-settings-popup label {
      font-weight: 500;
      margin-right: 6px;
    }
    .card-settings-popup select {
      margin-top: 2px;
      width: 100%;
      padding: 2px 4px;
      border-radius: 4px;
      border: 1px solid #d1d5db;
    }
    .card {
      position: relative;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1>APIFlow Monitor</h1>
      </div>
      <div class="header-actions">
        <div class="badge-container">
          <div class="env-badge"></div>
          <span id="envLabel">Environment: loading...</span>
        </div>
        <button class="btn" onclick="openAddModal()">+ Add Target</button>
      </div>
    </div>

    <div class="controls">
      <input type="text" id="filterInput" placeholder="Filter by URL or name..." onkeyup="filterCards()">
      <button class="btn" onclick="refreshTargets()">🔄 Refresh</button>
        <select id="cardStyleSelect" class="select-dashboard" onchange="setCardStyle(this.value)" title="Kart tipi seç">
          <option value="glass">Glass</option>
          <option value="gradient">Gradient</option>
          <option value="flat">Flat</option>
          <option value="border">Border</option>
        </select>
        <select id="shapeMode" class="select-dashboard" onchange="setShapeMode(this.value)" title="Shape mode seç">
          <option value="all">Shape: All</option>
          <option value="bars">Shape: Bar</option>
          <option value="curve">Shape: Curve</option>
          <option value="wave">Shape: Wave</option>
          <option value="cluster">Shape: Cluster</option>
        </select>
    </div>

    <div class="cards" id="cardsContainer">
      <div class="empty-state">
        <div>Loading...</div>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal" id="formModal">
    <div class="modal-content">
      <div class="modal-header" id="formTitle">Add Target</div>
      <div class="modal-body">
        <form id="targetForm" onsubmit="handleFormSubmit(event)">
          <input type="hidden" id="formTargetId" value="">
          <div class="form-group">
            <label for="formName">Name *</label>
            <input type="text" id="formName" required placeholder="e.g., API Backend">
          </div>
          <div class="form-group">
            <label for="formUrl">URL *</label>
            <input type="url" id="formUrl" required placeholder="https://api.example.com/health">
          </div>
          <div class="form-group">
            <label for="formMethod">HTTP Method</label>
            <select id="formMethod">
              <option value="GET">GET</option>
              <option value="HEAD">HEAD</option>
              <option value="POST">POST</option>
            </select>
          </div>
          <div class="form-group">
            <label for="formInterval">Interval (ms)</label>
            <input type="number" id="formInterval" value="30000" min="1000" step="1000">
          </div>
          <div class="form-group">
            <label><input type="checkbox" id="formPaused"> Paused</label>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn-close" onclick="closeFormModal()">Cancel</button>
        <button class="btn" onclick="document.getElementById('targetForm').dispatchEvent(new Event('submit'))">Save</button>
      </div>
    </div>
  </div>

  <script>
    let allTargets = [];
    let lastProbeResults = {};

    async function loadTargets() {
      try {
        const res = await fetch('/api/targets');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        allTargets = await res.json();
        renderCards();
      } catch (err) {
        console.error('[UI] Error loading targets:', err);
      }
    }

    // Card style state
    let cardStyle = localStorage.getItem('card-style') || 'glass';
    let shapeMode = localStorage.getItem('apiflow-monitor-shape-mode') || 'all';
    document.addEventListener('DOMContentLoaded', () => {
      const sel = document.getElementById('cardStyleSelect');
      if (sel) sel.value = cardStyle;
      const shapeSel = document.getElementById('shapeMode');
      if (shapeSel) shapeSel.value = shapeMode;
    });
    function setCardStyle(style) {
      cardStyle = style;
      localStorage.setItem('card-style', style);
      renderCards();
    }
    function setShapeMode(mode) {
      shapeMode = mode;
      localStorage.setItem('apiflow-monitor-shape-mode', mode);
      renderCards();
    }
    function renderCards() {
      const container = document.getElementById('cardsContainer');
      const q = document.getElementById('filterInput').value.toLowerCase();
      const filtered = allTargets.filter(t => !q || t.url.toLowerCase().includes(q) || (t.name || '').toLowerCase().includes(q));

      if (filtered.length === 0) {
        container.innerHTML = `<div class="empty-state">${allTargets.length === 0 ? 'No targets yet' : 'No matches found'}</div>`;
        return;
      }

      function barsBlock() {
        return `<div class=\"viz-box\"><div class=\"tiny\">Bar Dalga</div><div class=\"spark-bars\"><div class=\"spark-bar\" style=\"height:24px;background:#60a5fa;width:12px;display:inline-block;margin-right:2px;\"></div><div class=\"spark-bar\" style=\"height:18px;background:#60a5fa;width:12px;display:inline-block;margin-right:2px;\"></div><div class=\"spark-bar\" style=\"height:32px;background:#60a5fa;width:12px;display:inline-block;\"></div></div></div>`;
      }
      function curveBlock() {
        return `<div class=\"viz-box\"><div class=\"tiny\">Egrisellik Trendi</div><svg width=\"80\" height=\"32\"><path d=\"M0,24 Q20,8 40,24 T80,24\" stroke=\"#38bdf8\" fill=\"none\" stroke-width=\"2\"/></svg></div>`;
      }
      function waveBlock() {
        return `<div class=\"viz-box\"><div class=\"tiny\">Akis Seviyesi</div><svg width=\"80\" height=\"24\"><path d=\"M0,16 Q20,8 40,16 T80,16\" stroke=\"#818cf8\" fill=\"none\" stroke-width=\"2\"/></svg></div>`;
      }
      function clusterBlock() {
        return `<div class=\"viz-box\"><div class=\"tiny\">3D Kume Dagilimi</div><div style=\"display:flex;gap:4px;justify-content:center;\"><span style=\"width:10px;height:10px;background:#fbbf24;border-radius:50%;display:inline-block;\"></span><span style=\"width:10px;height:10px;background:#fbbf24;border-radius:50%;display:inline-block;\"></span><span style=\"width:10px;height:10px;background:#fbbf24;border-radius:50%;display:inline-block;\"></span></div></div>`;
      }

      // Karta özel ayarları oku
      function getCardSettings(id) {
        try {
          return JSON.parse(localStorage.getItem('card-settings-' + id)) || {};
        } catch { return {}; }
      }
      function setCardSettings(id, obj) {
        localStorage.setItem('card-settings-' + id, JSON.stringify(obj));
      }

      // Settings popup render fonksiyonu
      function settingsPopup(target) {
        const settings = getCardSettings(target.id);
        const style = settings.cardStyle || cardStyle;
        const shape = settings.shapeMode || shapeMode;
        return `<div class=\"card-settings-popup\" id=\"popup-${target.id}\" style=\"display:none;\">
          <div><label>Card Style:</label>
            <select onchange=\"updateCardSetting('${target.id}','cardStyle',this.value)\">
              <option value=\"glass\" ${style==='glass'?'selected':''}>Glass</option>
              <option value=\"gradient\" ${style==='gradient'?'selected':''}>Gradient</option>
              <option value=\"flat\" ${style==='flat'?'selected':''}>Flat</option>
              <option value=\"border\" ${style==='border'?'selected':''}>Border</option>
            </select>
          </div>
          <div style=\"margin-top:8px;\"><label>Shape Mode:</label>
            <select onchange=\"updateCardSetting('${target.id}','shapeMode',this.value)\">
              <option value=\"all\" ${shape==='all'?'selected':''}>All</option>
              <option value=\"bars\" ${shape==='bars'?'selected':''}>Bar</option>
              <option value=\"curve\" ${shape==='curve'?'selected':''}>Curve</option>
              <option value=\"wave\" ${shape==='wave'?'selected':''}>Wave</option>
              <option value=\"cluster\" ${shape==='cluster'?'selected':''}>Cluster</option>
            </select>
          </div>
        </div>`;
      }

      container.innerHTML = filtered.map(target => {
        const lastResult = lastProbeResults[target.id] || {};
        const signal = lastResult.signal || 'none';
        const statusClass = `status-${signal}`;
        const settings = getCardSettings(target.id);
        const cStyle = settings.cardStyle || cardStyle;
        const sMode = settings.shapeMode || shapeMode;
        let visuals = '';
        if (sMode === 'all' || sMode === 'bars') visuals += barsBlock();
        if (sMode === 'all' || sMode === 'curve') visuals += curveBlock();
        if (sMode === 'all' || sMode === 'wave') visuals += waveBlock();
        if (sMode === 'all' || sMode === 'cluster') visuals += clusterBlock();
        return `
          <div class=\"card ${cStyle}\">
            <div class=\"card-header\">
              <div class=\"card-title\">${escapeHtml(target.name || 'Unnamed')}</div>
              <div class=\"card-status ${statusClass}\">${signal === 'UP' ? '✓ Up' : signal === 'WARN' ? '⚠ Warn' : signal === 'DOWN' ? '✗ Down' : '○ Unknown'}</div>
              <button class=\"card-settings-btn\" onclick=\"toggleCardSettings('${target.id}')\">⚙️</button>
            </div>
            <div class=\"card-url\">${escapeHtml(target.url)}</div>
            <div class=\"card-info\">
              <div class=\"info-item\"><div class=\"info-label\">Method</div><div class=\"info-value\">${target.method || 'GET'}</div></div>
              <div class=\"info-item\"><div class=\"info-label\">Interval</div><div class=\"info-value\">${target.intervalMs / 1000}s</div></div>
            </div>
            <div class=\"card-actions\">
              <button class=\"btn-edit\" onclick=\"openEditModal('${escapeAttr(target.id)}')\">✏ Edit</button>
              <button class=\"btn-delete\" onclick=\"deleteTarget('${escapeAttr(target.id)}')\">🗑 Delete</button>
            </div>
            <div class=\"visual-grid\">${visuals}</div>
            ${settingsPopup(target)}
          </div>
        `;
      }).join('');
      // Popup dışı tıklamada kapat
      document.querySelectorAll('.card-settings-popup').forEach(popup => {
        popup.addEventListener('click', e => e.stopPropagation());
      });
    }
    // Popup aç/kapat fonksiyonu
    function toggleCardSettings(id) {
      document.querySelectorAll('.card-settings-popup').forEach(p => p.style.display = 'none');
      const el = document.getElementById('popup-' + id);
      if (el) el.style.display = (el.style.display === 'block' ? 'none' : 'block');
      window.addEventListener('click', function handler(e) {
        if (!el.contains(e.target)) { el.style.display = 'none'; window.removeEventListener('click', handler); }
      });
    }
    // Ayar güncelleme fonksiyonu
    function updateCardSetting(id, key, value) {
      const settings = JSON.parse(localStorage.getItem('card-settings-' + id) || '{}');
      settings[key] = value;
      localStorage.setItem('card-settings-' + id, JSON.stringify(settings));
      renderCards();
    }

    function filterCards() { renderCards(); }

    async function refreshTargets() { loadTargets(); }

    function openAddModal() {
      document.getElementById('formTargetId').value = '';
      document.getElementById('formTitle').textContent = 'Add Target';
      document.getElementById('targetForm').reset();
      document.getElementById('formModal').classList.add('open');
    }

    function openEditModal(targetId) {
      const target = allTargets.find(t => t.id === targetId);
      if (!target) return;
      document.getElementById('formTargetId').value = target.id;
      document.getElementById('formTitle').textContent = 'Edit Target';
      document.getElementById('formName').value = target.name || '';
      document.getElementById('formUrl').value = target.url || '';
      document.getElementById('formMethod').value = target.method || 'GET';
      document.getElementById('formInterval').value = target.intervalMs || 30000;
      document.getElementById('formPaused').checked = target.paused || false;
      document.getElementById('formModal').classList.add('open');
    }

    function closeFormModal() { document.getElementById('formModal').classList.remove('open'); }

    async function handleFormSubmit(event) {
      event.preventDefault();
      const targetId = document.getElementById('formTargetId').value;
      const payload = {
        name: document.getElementById('formName').value,
        url: document.getElementById('formUrl').value,
        method: document.getElementById('formMethod').value,
        intervalMs: parseInt(document.getElementById('formInterval').value),
        paused: document.getElementById('formPaused').checked
      };

      try {
        const method = targetId ? 'PUT' : 'POST';
        const url = targetId ? `/api/targets/${targetId}` : '/api/targets';
        const res = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        closeFormModal();
        await loadTargets();
      } catch (err) {
        alert('Error: ' + err.message);
      }
    }

    async function deleteTarget(targetId) {
      if (!confirm('Delete this target?')) return;
      try {
        const res = await fetch(`/api/targets/${targetId}`, { method: 'DELETE' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        await loadTargets();
      } catch (err) {
        alert('Error: ' + err.message);
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function escapeAttr(text) {
      return String(text).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    document.addEventListener('DOMContentLoaded', () => {
      const hostname = window.location.hostname;
      let env = 'unknown';
      
      if (hostname === 'localhost' || hostname === '127.0.0.1') {
        env = 'dev';
      } else if (hostname.startsWith('192.168.') || hostname.startsWith('10.')) {
        env = 'dev';
      } else if (hostname.includes('test')) {
        env = 'test';
      } else {
        env = 'prod';
      }
      
      let badgeBg = '#eab308';
      let badgeText = `Environment: DEV (${hostname})`;
      if (env === 'prod') {
        badgeBg = '#22c55e';
        badgeText = `Environment: PROD (${hostname})`;
      } else if (env === 'test') {
        badgeBg = '#ef4444';
        badgeText = `Environment: TEST (${hostname})`;
      }
      
      const badge = document.querySelector('.env-badge');
      if (badge) badge.style.background = badgeBg;
      
      document.getElementById('envLabel').textContent = badgeText;
      loadTargets();
      setInterval(loadTargets, 15000);
    });

    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeFormModal(); });
  </script>
</body>
</html>
