<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>APIFlow Monitor MVP</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --ink: #111827;
      --muted: #6b7280;
      --panel: #ffffff;
      --line: #e5e7eb;
      --ok: #16a34a;
      --bad: #dc2626;
      --warn: #d97706;
      --accent: #0ea5e9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 10%, #dbeafe 0%, transparent 34%),
        radial-gradient(circle at 88% 18%, #cffafe 0%, transparent 38%),
        var(--bg);
    }
    .wrap {
      max-width: 1240px;
      margin: 0 auto;
      padding: 20px;
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 16px;
    }
    .panel {
      background: rgba(255,255,255,0.86);
      -webkit-backdrop-filter: blur(4px);
      backdrop-filter: blur(4px);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 12px 28px rgba(10, 30, 60, 0.08);
    }
    h1 { margin: 0; font-size: 22px; }
    h2 { margin: 0; font-size: 16px; color: var(--muted); }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
    }
    .card {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      background: #fff;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--accent);
      opacity: 0.9;
    }
    .row { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
    .name { font-size: 14px; font-weight: 700; }
    .url { font-size: 11px; color: var(--muted); margin: 6px 0 10px; word-break: break-all; }
    .badge {
      border-radius: 999px;
      padding: 2px 9px;
      font-size: 11px;
      color: white;
      font-weight: 700;
    }
    .ok { background: var(--ok); }
    .bad { background: var(--bad); }
    .warn { background: var(--warn); }
    pre {
      margin: 8px 0 0;
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px;
      max-height: 140px;
      overflow: auto;
      font-size: 11px;
      line-height: 1.3;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .logbox {
      max-height: 640px;
      overflow: auto;
      font-size: 12px;
      line-height: 1.45;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #0b1220;
      color: #d1d5db;
      padding: 10px;
    }
    .logline { margin: 0 0 6px; }
    .logline .t { color: #93c5fd; }
    .form {
      display: grid;
      gap: 8px;
      margin-top: 8px;
    }
    input, select, button {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px;
      font-size: 13px;
      font-family: inherit;
    }
    button {
      background: #111827;
      color: white;
      cursor: pointer;
    }
    .tiny { font-size: 11px; color: var(--muted); }
    .toolbar {
      display: grid;
      gap: 8px;
      margin: 8px 0 12px;
    }
    .filter-row {
      display: flex;
      gap: 6px;
    }
    .filter-btn {
      flex: 1;
      background: #ffffff;
      color: #111827;
      border: 1px solid var(--line);
      font-size: 12px;
      padding: 7px 8px;
    }
    .filter-btn.active {
      background: #0f172a;
      color: #ffffff;
    }
    .filter-count {
      font-size: 11px;
      color: var(--muted);
    }
    .alert-banner {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border: 1px solid #f59e0b;
      border-left: 4px solid #f59e0b;
      background: #fffbeb;
      border-radius: 10px;
      padding: 8px 10px;
      margin-bottom: 10px;
      font-size: 12px;
    }
    .alert-banner.high {
      border-color: #dc2626;
      background: #fef2f2;
    }
    .mini-actions {
      display: flex;
      gap: 6px;
    }
    .mini-btn {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #ffffff;
      color: #111827;
      font-size: 11px;
      padding: 4px 7px;
      cursor: pointer;
    }
    .card-actions {
      position: absolute;
      top: 8px;
      right: 8px;
      display: flex;
      gap: 4px;
    }
    .card-act {
      width: 26px;
      height: 26px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #ffffff;
      cursor: pointer;
      font-size: 12px;
      line-height: 1;
      padding: 0;
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 1000;
    }
    .modal-backdrop.open {
      display: flex;
    }
    .modal-card {
      width: min(460px, 100%);
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 18px 45px rgba(2, 6, 23, 0.25);
    }
    .muted-chip {
      display: inline-block;
      font-size: 11px;
      color: #92400e;
      background: #fef3c7;
      border-radius: 999px;
      padding: 2px 8px;
      margin-top: 6px;
    }
    .with-top-gap {
      margin-top: 14px;
    }
    .with-bottom-gap {
      margin-bottom: 10px;
    }
    .tight-top {
      margin-top: 6px;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    @media (max-width: 960px) {
      .wrap { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="panel">
      <div id="errorBanner" class="alert-banner">
        <div id="bannerText">Uyari</div>
        <div class="mini-actions">
          <button class="mini-btn" id="bannerMuteBtn" type="button">Sessize Al</button>
          <button class="mini-btn" id="bannerCloseBtn" type="button">Kapat</button>
        </div>
      </div>
      <div class="top">
        <div>
          <h1>APIFlow Monitor</h1>
          <h2>Baglanan API endpointlerini kart kart izle</h2>
        </div>
        <div class="tiny" id="summary">Yukleniyor...</div>
      </div>
      <div id="cards" class="grid"></div>
    </section>

    <aside class="panel">
      <h2>Filtre</h2>
      <div class="toolbar">
        <input id="searchBox" placeholder="Kart adi veya URL ara" />
        <div class="filter-row">
          <button id="filterAll" class="filter-btn active" type="button" data-filter="all">Tumu</button>
          <button id="filterUp" class="filter-btn" type="button" data-filter="up">Up</button>
          <button id="filterDown" class="filter-btn" type="button" data-filter="down">Down</button>
        </div>
        <div id="filterCount" class="filter-count">Gosterilen: 0 / 0</div>
      </div>

      <h2>Yeni API Ekle</h2>
      <form id="addForm" class="form">
        <input id="name" placeholder="Kart adi" required />
        <input id="url" placeholder="https://api.example.com/health" required />
        <select id="method" title="HTTP methodi sec">
          <option>GET</option>
          <option>POST</option>
          <option>HEAD</option>
        </select>
        <label class="sr-only" for="interval">Kontrol araligi (ms)</label>
        <input id="interval" type="number" min="3000" step="1000" value="10000" />
        <button type="submit">Kart Ekle</button>
      </form>
      <p class="tiny">Eklenen hedefler localStorage'da saklanir.</p>

      <h2 class="with-top-gap">Alarm Ayari</h2>
      <div class="form tight-top">
        <label class="sr-only" for="alertThreshold">Alarm esik degeri</label>
        <input id="alertThreshold" type="number" min="1" step="1" value="3" />
        <button type="button" id="resetAlertBtn">Alarmi Sifirla</button>
      </div>

      <h2 class="with-top-gap">Canli Log</h2>
      <div id="logs" class="logbox"></div>
    </aside>
  </div>

  <div id="editModal" class="modal-backdrop" aria-hidden="true">
    <div class="modal-card">
      <h2 class="with-bottom-gap">Karti Duzenle</h2>
      <form id="editForm" class="form">
        <input id="editName" placeholder="Kart adi" required />
        <input id="editUrl" placeholder="https://api.example.com/health" required />
        <select id="editMethod">
          <option>GET</option>
          <option>POST</option>
          <option>HEAD</option>
        </select>
        <input id="editInterval" type="number" min="3000" step="1000" value="10000" />
        <div class="filter-row">
          <button type="submit">Kaydet</button>
          <button id="editCancelBtn" type="button">Iptal</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const cardsEl = document.getElementById('cards');
    const logsEl = document.getElementById('logs');
    const summaryEl = document.getElementById('summary');
    const addForm = document.getElementById('addForm');
    const searchBoxEl = document.getElementById('searchBox');
    const filterCountEl = document.getElementById('filterCount');
    const filterButtons = Array.from(document.querySelectorAll('.filter-btn'));
    const errorBannerEl = document.getElementById('errorBanner');
    const bannerTextEl = document.getElementById('bannerText');
    const bannerMuteBtn = document.getElementById('bannerMuteBtn');
    const bannerCloseBtn = document.getElementById('bannerCloseBtn');
    const alertThresholdEl = document.getElementById('alertThreshold');
    const resetAlertBtn = document.getElementById('resetAlertBtn');
    const editModalEl = document.getElementById('editModal');
    const editFormEl = document.getElementById('editForm');
    const editNameEl = document.getElementById('editName');
    const editUrlEl = document.getElementById('editUrl');
    const editMethodEl = document.getElementById('editMethod');
    const editIntervalEl = document.getElementById('editInterval');
    const editCancelBtn = document.getElementById('editCancelBtn');

    const storeKey = 'apiflow-monitor-targets';
    const alertThresholdKey = 'apiflow-monitor-alert-threshold';
    const alertMutedKey = 'apiflow-monitor-alert-muted';
    let targets = [];
    let state = new Map();
    let intervalMap = new Map();
    let searchQuery = '';
    let statusFilter = 'all';
    let editingId = null;
    let errorCounts = new Map();
    let bannerDismissed = false;
    let alertConfig = {
      threshold: 3,
      muted: false
    };

    function log(msg) {
      const line = document.createElement('div');
      line.className = 'logline';
      line.innerHTML = `<span class="t">[${new Date().toLocaleTimeString('tr-TR')}]</span> ${msg}`;
      logsEl.prepend(line);
      while (logsEl.children.length > 120) logsEl.removeChild(logsEl.lastChild);
    }

    function statusBadge(item) {
      if (!item) return '<span class="badge warn">PENDING</span>';
      if (item.signal === 'TIMEOUT') return '<span class="badge bad">TIMEOUT</span>';
      if (item.ok) return `<span class="badge ok">UP ${item.status}</span>`;
      if (item.status === 0) return '<span class="badge bad">DOWN</span>';
      return `<span class="badge warn">WARN ${item.status}</span>`;
    }

    function normalizeStatus(item) {
      if (!item) return 'down';
      if (item.signal) {
        return item.signal === 'UP' ? 'up' : 'down';
      }
      return item.ok ? 'up' : 'down';
    }

    function esc(text) {
      const d = document.createElement('div');
      d.textContent = text || '';
      return d.innerHTML;
    }

    function generateId() {
      if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') {
        return crypto.randomUUID();
      }
      return `t_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
    }

    function normalizeTarget(input) {
      return {
        id: input.id || generateId(),
        name: String(input.name || '').trim(),
        url: String(input.url || '').trim(),
        method: String(input.method || 'GET').toUpperCase(),
        intervalMs: Math.max(3000, Number(input.intervalMs || 10000)),
        paused: Boolean(input.paused)
      };
    }

    function updateBanner() {
      const activeCount = errorCounts.size;

      if (activeCount === 0) {
        errorBannerEl.style.display = 'none';
        errorBannerEl.classList.remove('high');
        bannerDismissed = false;
        return;
      }

      const names = targets
        .filter((t) => errorCounts.has(t.id))
        .slice(0, 3)
        .map((t) => t.name)
        .join(', ');

      bannerTextEl.textContent = `${activeCount} endpoint hata veriyor${names ? `: ${names}` : ''}`;
      if (activeCount >= Math.max(5, alertConfig.threshold + 1)) {
        errorBannerEl.classList.add('high');
      } else {
        errorBannerEl.classList.remove('high');
      }

      if (!bannerDismissed && !alertConfig.muted && activeCount >= alertConfig.threshold) {
        errorBannerEl.style.display = 'flex';
      } else if (errorBannerEl.style.display !== 'none' && !bannerDismissed && activeCount > 0) {
        errorBannerEl.style.display = 'flex';
      }

      bannerMuteBtn.textContent = alertConfig.muted ? 'Sessiz: Ac' : 'Sessize Al';
    }

    function trackFailure(targetId) {
      const nextCount = (errorCounts.get(targetId) || 0) + 1;
      errorCounts.set(targetId, nextCount);
      updateBanner();
    }

    function trackSuccess(targetId) {
      if (errorCounts.has(targetId)) {
        errorCounts.delete(targetId);
      }
      updateBanner();
    }

    function getFilteredTargets() {
      const query = searchQuery.trim().toLowerCase();
      return targets.filter((target) => {
        const item = state.get(target.id);
        const searchMatched =
          !query ||
          target.name.toLowerCase().includes(query) ||
          target.url.toLowerCase().includes(query);

        const statusMatched =
          statusFilter === 'all' ||
          (statusFilter === 'up' && normalizeStatus(item) === 'up') ||
          (statusFilter === 'down' && normalizeStatus(item) === 'down');

        return searchMatched && statusMatched;
      });
    }

    function stopTarget(id) {
      const timerId = intervalMap.get(id);
      if (timerId) {
        clearInterval(timerId);
        intervalMap.delete(id);
      }
    }

    function render() {
      cardsEl.innerHTML = '';
      let up = 0;
      let down = 0;

      const filtered = getFilteredTargets();

      for (const target of targets) {
        const item = state.get(target.id);
        if (item?.ok) up += 1; else if (item) down += 1;
      }

      for (const target of filtered) {
        const item = state.get(target.id);

        const card = document.createElement('article');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-actions">
            <button class="card-act" type="button" data-action="toggle" data-id="${esc(target.id)}" title="Pause/Resume">${target.paused ? '▶' : '⏸'}</button>
            <button class="card-act" type="button" data-action="edit" data-id="${esc(target.id)}" title="Duzenle">✎</button>
            <button class="card-act" type="button" data-action="delete" data-id="${esc(target.id)}" title="Sil">✕</button>
          </div>
          <div class="row">
            <div class="name">${esc(target.name)}</div>
            ${statusBadge(item)}
          </div>
          <div class="url">${esc(target.method)} ${esc(target.url)}</div>
          <div class="tiny">Latency: ${item ? item.latencyMs + ' ms' : '-'}</div>
          <div class="tiny">Son kontrol: ${item ? new Date(item.checkedAt).toLocaleTimeString('tr-TR') : '-'}</div>
          ${target.paused ? '<div class="muted-chip">Duraklatildi</div>' : ''}
          <pre>${esc(item?.json ? JSON.stringify(item.json, null, 2) : (item?.preview || 'Henuz cevap yok'))}</pre>
        `;
        cardsEl.appendChild(card);
      }

      summaryEl.textContent = `Toplam: ${targets.length} | Up: ${up} | Down/Warn: ${down}`;
      filterCountEl.textContent = `Gosterilen: ${filtered.length} / ${targets.length}`;
    }

    async function probe(target) {
      if (target.paused) {
        return;
      }

      try {
        const res = await fetch('/api/probe', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({
            url: target.url,
            method: target.method,
            timeoutMs: Math.max(3000, Math.min(target.intervalMs - 500, 15000))
          })
        });
        const result = await res.json();
        state.set(target.id, result);

        if (result.ok) {
          trackSuccess(target.id);
        } else {
          trackFailure(target.id);
        }

        log(`${esc(target.name)} -> ${result.ok ? 'UP' : 'DOWN/WARN'} (${result.status || 'ERR'})`);
      } catch (err) {
        state.set(target.id, {
          ok: false,
          status: 0,
          signal: 'DOWN',
          checkedAt: new Date().toISOString(),
          latencyMs: 0,
          preview: '',
          json: null,
          error: String(err)
        });
        trackFailure(target.id);
        log(`${esc(target.name)} -> ERROR ${esc(String(err))}`);
      }
      render();
    }

    function startTarget(target) {
      stopTarget(target.id);
      if (target.paused) {
        render();
        return;
      }

      probe(target);
      const timerId = setInterval(() => probe(target), target.intervalMs || 10000);
      intervalMap.set(target.id, timerId);
    }

    function loadAlertSettings() {
      const rawThreshold = Number(localStorage.getItem(alertThresholdKey) || 3);
      alertConfig.threshold = Number.isFinite(rawThreshold) && rawThreshold > 0 ? rawThreshold : 3;
      alertConfig.muted = localStorage.getItem(alertMutedKey) === 'true';
      alertThresholdEl.value = String(alertConfig.threshold);
      bannerMuteBtn.textContent = alertConfig.muted ? 'Sessiz: Ac' : 'Sessize Al';
    }

    function saveAlertSettings() {
      localStorage.setItem(alertThresholdKey, String(alertConfig.threshold));
      localStorage.setItem(alertMutedKey, String(alertConfig.muted));
    }

    function loadLocalTargets() {
      try {
        const raw = localStorage.getItem(storeKey);
        if (!raw) return [];
        const arr = JSON.parse(raw);
        if (!Array.isArray(arr)) return [];
        return arr.map(normalizeTarget);
      } catch {
        return [];
      }
    }

    function saveLocalTargets(arr) {
      localStorage.setItem(storeKey, JSON.stringify(arr));
    }

    addForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const t = normalizeTarget({
        name: document.getElementById('name').value.trim(),
        url: document.getElementById('url').value.trim(),
        method: document.getElementById('method').value,
        intervalMs: Number(document.getElementById('interval').value || 10000)
      });
      if (!t.name || !t.url) return;

      const duplicate = targets.some((x) => x.method === t.method && x.url === t.url);
      if (duplicate) {
        log(`Ayni method+url mevcut: ${esc(t.url)}`);
        return;
      }

      targets.push(t);
      saveLocalTargets(targets);
      startTarget(t);
      render();
      addForm.reset();
      log(`Yeni kart eklendi: ${esc(t.name)}`);
    });

    cardsEl.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-action][data-id]');
      if (!btn) return;

      const action = btn.getAttribute('data-action');
      const id = btn.getAttribute('data-id');
      const target = targets.find((t) => t.id === id);
      if (!target) return;

      if (action === 'delete') {
        stopTarget(id);
        targets = targets.filter((t) => t.id !== id);
        state.delete(id);
        errorCounts.delete(id);
        saveLocalTargets(targets);
        updateBanner();
        render();
        log(`Kart silindi: ${esc(target.name)}`);
        return;
      }

      if (action === 'toggle') {
        target.paused = !target.paused;
        if (target.paused) {
          stopTarget(id);
          log(`Kart duraklatildi: ${esc(target.name)}`);
        } else {
          startTarget(target);
          log(`Kart devam ettirildi: ${esc(target.name)}`);
        }
        saveLocalTargets(targets);
        render();
        return;
      }

      if (action === 'edit') {
        editingId = id;
        editNameEl.value = target.name;
        editUrlEl.value = target.url;
        editMethodEl.value = target.method;
        editIntervalEl.value = String(target.intervalMs);
        editModalEl.classList.add('open');
        editModalEl.setAttribute('aria-hidden', 'false');
      }
    });

    editCancelBtn.addEventListener('click', () => {
      editingId = null;
      editModalEl.classList.remove('open');
      editModalEl.setAttribute('aria-hidden', 'true');
    });

    editFormEl.addEventListener('submit', (e) => {
      e.preventDefault();
      const target = targets.find((t) => t.id === editingId);
      if (!target) return;

      const nextName = editNameEl.value.trim();
      const nextUrl = editUrlEl.value.trim();
      const nextMethod = editMethodEl.value;
      const nextInterval = Math.max(3000, Number(editIntervalEl.value || 10000));

      if (!nextName || !nextUrl) return;

      const duplicate = targets.some((x) => x.id !== target.id && x.method === nextMethod && x.url === nextUrl);
      if (duplicate) {
        log(`Duzenleme reddedildi, ayni method+url mevcut: ${esc(nextUrl)}`);
        return;
      }

      target.name = nextName;
      target.url = nextUrl;
      target.method = nextMethod;
      target.intervalMs = nextInterval;

      saveLocalTargets(targets);
      if (!target.paused) {
        startTarget(target);
      }
      render();
      log(`Kart guncellendi: ${esc(target.name)}`);

      editingId = null;
      editModalEl.classList.remove('open');
      editModalEl.setAttribute('aria-hidden', 'true');
    });

    searchBoxEl.addEventListener('input', (e) => {
      searchQuery = String(e.target.value || '');
      render();
    });

    filterButtons.forEach((btn) => {
      btn.addEventListener('click', () => {
        statusFilter = btn.getAttribute('data-filter') || 'all';
        filterButtons.forEach((x) => x.classList.remove('active'));
        btn.classList.add('active');
        render();
      });
    });

    bannerMuteBtn.addEventListener('click', () => {
      alertConfig.muted = !alertConfig.muted;
      saveAlertSettings();
      updateBanner();
    });

    bannerCloseBtn.addEventListener('click', () => {
      bannerDismissed = true;
      errorBannerEl.style.display = 'none';
    });

    alertThresholdEl.addEventListener('change', () => {
      const next = Math.max(1, Number(alertThresholdEl.value || 3));
      alertConfig.threshold = next;
      alertThresholdEl.value = String(next);
      bannerDismissed = false;
      saveAlertSettings();
      updateBanner();
      render();
    });

    resetAlertBtn.addEventListener('click', () => {
      errorCounts.clear();
      bannerDismissed = false;
      updateBanner();
      render();
      log('Alarm durumu sifirlandi');
    });

    async function init() {
      const base = await fetch('/api/targets').then(r => r.json()).catch(() => []);
      const local = loadLocalTargets();

      const map = new Map();
      for (const t of [...base, ...local]) {
        const normalized = normalizeTarget(t);
        map.set(`${normalized.method}|${normalized.url}`, normalized);
      }
      targets = [...map.values()];
      saveLocalTargets(targets);
      loadAlertSettings();

      for (const t of targets) startTarget(t);
      render();
      updateBanner();
      log('Monitor baslatildi');
    }

    init();
  </script>
</body>
</html>
