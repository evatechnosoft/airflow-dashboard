name: Auto Deploy to ZimaOS

on:
  push:
    branches:
      - dev
      - test

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set environment vars
        id: set-env
        run: |
          BRANCH="${GITHUB_REF##*/}"
          if [[ "$BRANCH" == "dev" ]]; then
            ENV=dev
            echo "server_ip=${{ secrets.DEV_SERVER_IP }}" >> $GITHUB_OUTPUT
            echo "server_path=${{ secrets.DEV_SERVER_PATH }}" >> $GITHUB_OUTPUT
          elif [[ "$BRANCH" == "test" ]]; then
            ENV=test
            echo "server_ip=${{ secrets.TEST_SERVER_IP }}" >> $GITHUB_OUTPUT
            echo "server_path=${{ secrets.TEST_SERVER_PATH }}" >> $GITHUB_OUTPUT
          else
            ENV=prod
            echo "server_ip=${{ secrets.PROD_SERVER_IP }}" >> $GITHUB_OUTPUT
            echo "server_path=${{ secrets.PROD_SERVER_PATH }}" >> $GITHUB_OUTPUT
          fi
          echo "env=$ENV" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build -t apiflow-monitor:${{ steps.set-env.outputs.env }} .
          docker save apiflow-monitor:${{ steps.set-env.outputs.env }} | gzip > apiflow-monitor-${{ steps.set-env.outputs.env }}.tar.gz

      - name: Copy Docker image to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ steps.set-env.outputs.server_ip }}
          username: dean
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: "apiflow-monitor-${{ steps.set-env.outputs.env }}.tar.gz"
          target: ${{ steps.set-env.outputs.server_path }}

      - name: Load & run Docker image on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.set-env.outputs.server_ip }}
          username: dean
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd ${{ steps.set-env.outputs.server_path }}
            docker load < apiflow-monitor-${{ steps.set-env.outputs.env }}.tar.gz
            docker stop apiflow-monitor-${{ steps.set-env.outputs.env }} || true
            docker rm apiflow-monitor-${{ steps.set-env.outputs.env }} || true
            docker run -d --name apiflow-monitor-${{ steps.set-env.outputs.env }} --restart unless-stopped -p 9201:9201 apiflow-monitor:${{ steps.set-env.outputs.env }}
            # Ortam geçişlerinde diğer containerları kaldır
            if [ "${{ steps.set-env.outputs.env }}" = "prod" ]; then
              docker stop apiflow-monitor-dev || true
              docker rm apiflow-monitor-dev || true
              docker stop apiflow-monitor-test || true
              docker rm apiflow-monitor-test || true
            elif [ "${{ steps.set-env.outputs.env }}" = "dev" ]; then
              docker stop apiflow-monitor-prod || true
              docker rm apiflow-monitor-prod || true
              docker stop apiflow-monitor-test || true
              docker rm apiflow-monitor-test || true
            fi

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run smoke test
        run: |
          SMOKE_URL="${{ secrets.SMOKE_URL }}"
          if [ -z "$SMOKE_URL" ]; then
            SMOKE_URL="http://127.0.0.1:9201/healthz"
          fi
          curl -fsS "$SMOKE_URL"

  rollback:
    needs: deploy
    if: failure() && needs.deploy.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Rollback (manual placeholder)
        run: echo "Rollback işlemi manuel olarak uygulanmalı."
