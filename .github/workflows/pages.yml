name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          cp index.html dist/

          if [ -d "inputs" ]; then
            mkdir -p dist/inputs
            cp -R inputs/. dist/inputs/
          fi

          if [ -d "output/shared" ]; then
            mkdir -p dist/output/shared
            cp -R output/shared/. dist/output/shared/
          fi

          touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
